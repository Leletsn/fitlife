<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind.config.js"></script>
    <script defer src="../js/imc.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>FitLife - IMC</title>
  </head>

  <body class="bg-page font-sans text-ink selection:bg-primary/30">
    <nav
      aria-label="Principal"
      class="flex h-auto flex-col items-center justify-center gap-2 bg-white p-4 min-[491px]:h-20 min-[491px]:flex-row min-[491px]:justify-between min-[491px]:px-20 min-[491px]:py-0"
    >
      <a
        href="../index.html"
        class="text-2xl font-semibold text-brand no-underline"
      >
        <i class="fas fa-heartbeat"></i>
        FitLife
      </a>

      <ul
        class="flex list-none flex-wrap justify-center gap-3 min-[491px]:gap-6"
      >
        <li>
          <a
            href="../index.html"
            class="relative text-secondary no-underline transition before:absolute before:-inset-y-3 before:inset-x-0 hover:text-brand"
            >Home</a
          >
        </li>
        <li>
          <a
            href="./imc.html"
            aria-current="page"
            class="relative border-b-[3px] border-primary text-brand no-underline before:absolute before:-inset-y-3 before:inset-x-0"
            >IMC</a
          >
        </li>
        <li>
          <a
            href="./tmb.html"
            class="relative text-secondary no-underline transition before:absolute before:-inset-y-3 before:inset-x-0 hover:text-brand"
            >TMB</a
          >
        </li>
        <li>
          <a
            href="./water.html"
            class="relative text-secondary no-underline transition before:absolute before:-inset-y-3 before:inset-x-0 hover:text-brand"
            >Água</a
          >
        </li>
      </ul>
    </nav>

    <main
      class="mx-auto flex w-[90vw] items-center justify-center py-8 min-[491px]:w-[80vw]"
    >
      <section
        class="motion-safe:animate-rise flex w-full flex-col gap-4 rounded-[10px] bg-white p-4 shadow-[0_0_10px_10px_rgba(0,0,0,0.05)] min-[491px]:p-8"
      >
        <div class="text-center">
          <h1 class="text-[1.8rem] text-secondary">
            <i class="fas fa-weight"></i> Cálculo de IMC
          </h1>
        </div>

        <form id="bmi-form" class="flex flex-col gap-4">
          <div class="flex flex-col gap-2">
            <label for="weight" class="font-semibold text-secondary"
              >Peso (kg)</label
            >
            <input
              type="number"
              step="any"
              min="1"
              required
              max="500"
              inputmode="decimal"
              placeholder="Ex: 70"
              id="weight"
              class="rounded-[5px] border-2 border-field p-3 font-[inherit] transition-colors placeholder:text-gray-500 focus:border-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="height" class="font-semibold text-secondary"
              >Altura (m)</label
            >
            <input
              type="number"
              step="any"
              min="0.5"
              required
              max="2.8"
              inputmode="decimal"
              placeholder="Ex: 1.7"
              id="height"
              class="rounded-[5px] border-2 border-field p-3 font-[inherit] transition-colors placeholder:text-gray-500 focus:border-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
            />
          </div>

          <button
            type="submit"
            class="cursor-pointer rounded-[10px] bg-brand p-3 text-center font-semibold text-white transition hover:bg-brand-dark motion-safe:active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
          >
            Calcular
          </button>
          <a
            href="../index.html"
            class="rounded-[10px] bg-secondary p-3 text-center font-semibold text-white no-underline transition hover:bg-ink motion-safe:active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
            >Voltar</a
          >
        </form>

        <div
          id="result"
          role="status"
          class="mt-7 rounded-[10px] bg-[#e8f8f5] p-4 text-center transition duration-500"
        >
          <p id="result-empty" class="text-muted">
            Preencha os campos e calcule.
          </p>
          <div id="result-content" class="hidden">
            <p>Seu IMC é</p>
            <p id="bmi-value" class="text-5xl font-bold text-brand"></p>
            <p id="bmi-category" class="font-semibold"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="p-4 text-center text-muted">
      <p>© 2026 FitLife</p>
    </footer>
  </body>
</html>
