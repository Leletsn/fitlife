<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <title>FitLife - Imc</title>
</head>

<body>
  <nav>
    <a href="../index.html" id="logo">
      <i class="fas fa-heartbeat"></i>
      FitLife
    </a>

    <ul class="nav-links">
      <li><a href="../index.html" class="nav-link">Home</a></li>
      <li><a href="./imc.html" class="nav-link active">IMC</a></li>
      <li><a href="./tmb.html" class="nav-link">TMB</a></li>
      <li><a href="./water.html" class="nav-link">Água</a></li>
    </ul>
  </nav>

  <main>
    <section class="tool-container">
      <div class="tool-container-title">
        <h2><i class="fas fa-weight"></i> Cálculo de IMC</h2>
      </div>

      <form action="">
        <div class="form-group">
          <label for="weight">Peso (kg)</label>
          <input type="number" placeholder="Ex: 70" id="weight"/>
        </div>

        <div class="form-group">
          <label for="height">Altura (m)</label>
          <input type="number" placeholder="Ex: 1.7" id="height" />
        </div>

        <button class="action-btn" type="submit" onclick="calcularIMC(event)">Calcular</button>
        <a class="action-btn btn-back" href="../index.html">Voltar</a>
      </form>

      <div id="result-box" class="result-box">
        <p>Seu IMC é:</p>
        <p>00.0</p>
        <p>Classificação</p>
      </div>

    </section>
  </main>

  <script src="../js/imc.js"></script>

</body>

</html>
